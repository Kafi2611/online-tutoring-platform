{% extends "base.html" %}
{% block title %}Register - TutorHub{% endblock %}
{% block content %}
<div class="form-card narrow">
    <h1>Create Account</h1>
    <p>Choose the Student or Tutor role during registration.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Register</button>
    </form>
    <p class="muted">Already registered? <a href="{% url 'accounts:login' %}">Log in</a>.</p>
</div>
{% endblock %}
