{% extends "base.html" %}
{% block title %}Login - TutorHub{% endblock %}
{% block content %}
<div class="form-card narrow">
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button class="button" type="submit">Login</button>
    </form>
    <p class="muted">No account yet? <a href="{% url 'accounts:register' %}">Register</a>.</p>
</div>
{% endblock %}
